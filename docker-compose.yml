services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: bulletin_app
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
    networks:
      - bulletin_net

  web:
    image: nginx:alpine
    container_name: bulletin_web
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    ports:
      - "${BULLETIN_WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - bulletin_net

  db:
    image: mysql:8.0
    container_name: bulletin_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --default-time-zone=+03:00
    environment:
      TZ: Europe/Istanbul
      MYSQL_DATABASE: bulletin
      MYSQL_USER: bulletin
      MYSQL_PASSWORD: bulletin_password
      MYSQL_ROOT_PASSWORD: bulletin_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ubulletin -pbulletin_password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bulletin_net

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: bulletin_pma
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
      PMA_HOST: db
      PMA_USER: bulletin
      PMA_PASSWORD: bulletin_password
    ports:
      - "${BULLETIN_PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - bulletin_net

networks:
  bulletin_net:
    driver: bridge

volumes:
  db_data:
    external: true
    name: bulletin_db_data
