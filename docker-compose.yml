services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: rojname_app
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
    networks:
      - rojname_net

  web:
    image: nginx:alpine
    container_name: rojname_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - rojname_net

  db:
    image: mysql:8.0
    container_name: rojname_db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: rojname
      MYSQL_USER: rojname
      MYSQL_PASSWORD: rojname_password
      MYSQL_ROOT_PASSWORD: rojname_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rojname_net

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: rojname_pma
    environment:
      PMA_HOST: db
      PMA_USER: rojname
      PMA_PASSWORD: rojname_password
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - rojname_net

networks:
  rojname_net:
    driver: bridge

volumes:
  db_data:
