server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html index.htm;

    # Fix: Docker port mapping (8080->80) causes Nginx to drop port on directory redirects
    absolute_redirect off;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Client Body Size
    client_max_body_size 100M;

    # 1. JS Cache Rewrite
    location ~ ^/cache/js/(.*)\.js$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/js.php;
        fastcgi_param QUERY_STRING cachefile=$1;
    }

    # 2. CSS Cache Rewrite
    location ~ ^/cache/css/(.*)\.css$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/css.php;
        fastcgi_param QUERY_STRING cachefile=$1;
    }

    # 3. Image Resize Rewrite
    location ~ ^/r/(.*)/f/(.*)\.(gif|jpeg|jpg|png|webp)$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/resize.php;
        fastcgi_param QUERY_STRING file=$2.$3&options=$1;
    }

    # Deny PHP execution inside writable/static directories
    location ~* ^/(static|cache|data|templates_c|uploads)/.*\.(php|phtml|phar|inc)$ {
        deny all;
    }

    # Main PHP execution
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Static files
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Robots rewrite
    rewrite ^/robots\.txt$ /robots.php last;

    # Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Allow access to .well-known for RFC 8414 / RFC 9728 discovery
    location ^~ /.well-known/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
}