; Development PHP Configuration
; Geliştirme Ortamı PHP Ayarları

; Hata ayıklama için
display_errors = On
error_reporting = E_ALL
log_errors = On

; Bellek ve performans ayarları
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Dosya yükleme ayarları
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20

; Xdebug ayarları (eğer kurulu ise)
xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log = /var/log/xdebug.log

; OpCache ayarları (geliştirme için devre dışı)
opcache.enable = 0

; Diğer ayarlar
expose_php = On
html_errors = On